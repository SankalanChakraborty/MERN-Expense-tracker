# Render Blueprint — https://render.com/docs/blueprint-spec
# Create the service from this file via Render > New > Blueprint, then fill in
# the values marked sync:false in the dashboard (they are never committed).
services:
  - type: web
    name: expensely-api
    runtime: node
    plan: free
    rootDir: Backend
    # `ci` installs exactly the lockfile (reproducible); `--omit=dev` keeps
    # mongodb-memory-server off the box — it downloads a full MongoDB binary at
    # install time, which would blow the free tier's build time and disk.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Number of proxy hops to trust for client-IP resolution (rate limiting).
      # Verify at /api/v1/health that clientIp is a real visitor address.
      - key: TRUST_PROXY
        value: "1"
      # Set these in the Render dashboard — never commit them.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_ACCESS_TOKEN
        sync: false
      - key: JWT_SECRET_REFRESH_TOKEN
        sync: false
      # Your Vercel URL, e.g. https://expensely.vercel.app
      - key: CLIENT_ORIGINS
        sync: false
      # OTP verification email. Render's free tier blocks outbound SMTP ports
      # (25/465/587), so the HTTP API is the working path here — SMTP would
      # hang until it timed out. Keep the SMTP vars for local/other hosts.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
